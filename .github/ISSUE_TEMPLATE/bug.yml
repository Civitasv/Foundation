name: Bug
description: Report a broken behavior, graph rule, build, or learning interaction.
title: "fix: "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the concept, route, command, or minimal steps.
    validations:
      required: true
